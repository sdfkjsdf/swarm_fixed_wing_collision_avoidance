"/**":
  ros__parameters:
    # Shared AMAC policy for both local HILS workers and onboard workers.
    # Numerical superiority margins are project values because the public
    # Auto ACAS sources do not disclose them.
    amac_active_switching_enabled: true
    amac_active_switch_cost_margin: 0.01
    amac_active_switch_minimum_ad_margin_m: 1.0

    # Keep the Lockheed/AMAC comparison AD-only. TC-CBF comparison profiles
    # enable their own candidate filter explicitly.
    positive_margin_filter_enabled: false

    # Formation remains nominal guidance. No geometry-specific line profile
    # exempts a pair from the common AD activation rule.
    formation_discrimination_enabled: false
