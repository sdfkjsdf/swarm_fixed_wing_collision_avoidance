# Flocking guidance + Airframe spec — vtol_guidance_node 용 통합 파라미터
#
# 사용법:
#   ros2 run collision_avoidance vtol_guidance_node \
#     --ros-args \
#     --params-file <path>/flocking_params.yaml \
#     -p vehicle_ID:=0 -p total_agent_num:=5 \
#     -r __node:=vtol_guidance_0

"/**":
  ros__parameters:

    # ═══════════════════════════════════════════════════════════
    # Flocking 알고리즘 파라미터
    # ═══════════════════════════════════════════════════════════
    flocking_lambda: 1.0           # alignment 게인
    flocking_beta: 0.25            # alignment 거리 감쇠 지수
    flocking_k1: 0.2            # cohesion (속도-위치 내적) 게인
    flocking_k2: 0.256           # separation/거리유지 게인
    flocking_desired_distance: 30.0 # 이웃과 유지할 거리 [m]

    # 적분 sample period (ZOH) — updateSetpoint 호출 rate 와 일치시킬 것
    integration_dt: 0.0333         # [s]

    # ═══════════════════════════════════════════════════════════
    # PX4 airframe 파라미터 (QGC 와 동기화)
    # ═══════════════════════════════════════════════════════════
    airspeed_min: 12.0              # PX4 FW_AIRSPD_MIN (stall 여유 포함)
    airspeed_cruise: 15.0           # PX4 FW_AIRSPD_TRIM (참조용)
    airspeed_max: 25.0              # PX4 FW_AIRSPD_MAX

    height_rate_max_climb: 8.0      # PX4 FW_T_CLMB_MAX
    height_rate_min_sink: 2.2       # PX4 FW_T_SINK_MIN (TECS 하한 에너지 계산용)
    height_rate_max_sink: 2.2       # PX4 FW_T_SINK_MAX

    # TECS 에너지 예산 기반 dV/dt 클램프 (AirframeLimits)
    energy_fraction: 0.5            # 총 에너지 중 속도 변화에 배분하는 비율
    gravity: 9.80665                # 중력가속도 [m/s^2]

    max_roll_deg: 50.0              # PX4 FW_R_LIM (coordinated turn 계산용)
    max_roll_rate_deg_per_s: 70.0   # PX4 FW_R_RMAX (predictor roll-rate clamp)
    max_yaw_rate_deg_per_s: 50.0    # PX4 FW_Y_RMAX (V4 conservative cap)
    amac_communication_delay_margin_m: 0.0 # residual-only MASD term; calibrate before enabling

    # V4 safe-control Step-3 shadow configuration
    v4_safe_control_enabled: true
    v4_shadow_only: true
    v4_control_architecture: legacy_safe_control_set
    v4_margin_time_constant_s: 5.0
    v4_candidate_guard_deg_per_s: 0.5
    v4_constraint_tolerance_mps: 0.00001
    v4_interval_tolerance_radps: 0.0000001
    v4_speed_tolerance_mps: 0.001
    v4_direction_tolerance_m: 0.0001
    v4_maximum_airspeed_age_s: 1.0
    v4_maximum_nominal_age_s: 1.0
    mode_b_path_alpha_gain_per_s: 0.2
    mode_b_terminal_alpha_gain_per_s: 0.5
    mode_b_certification_tolerance_m: 0.000001
    mode_b_maximum_intent_age_s: 1.0

    # Lockheed baseline formation-discrimination profile. Disabled until the
    # UAV boundaries below are calibrated from SILS/flight logs.
    formation_discrimination_enabled: false
    formation_aggregation_policy: per_threat_exemption_only
    formation_profile_name: unconfigured
    formation_profile_kind: uav_calibrated
    formation_representative_wingspan_m: 0.0
    formation_range0_wingspan_scale: 0.0
    formation_uncertainty_margin_m: 0.0
    formation_range1_offset_m: 0.0
    formation_closure_lower_entry_mps: 0.0
    formation_closure_lower_exit_mps: 0.0
    formation_fdz_entry_limit_m: 0.0
    formation_fdz_exit_limit_m: 0.0
    formation_max_range_entry_m: 0.0
    formation_max_range_exit_m: 0.0
    formation_maximum_state_age_s: 0.0
    formation_maximum_future_skew_s: 0.0
    formation_maximum_timestamp_skew_s: 0.0
    formation_lookup_policy: reject_outside_table

    # ═══════════════════════════════════════════════════════════
    # PX4 직접 대응 없음 — 우리가 정한 값
    # ═══════════════════════════════════════════════════════════

    # 비행 경로각 γ 한계 — Spherical state 의 pitch 자유도
    max_pitch_deg: 30.0             # |γ| ≤ 30°  (cos(γ) ≥ 0.866 보장)

    # γ 변화율 (pitch angular rate) 한계
    max_pitch_rate_deg_per_sec: 60.0  # ~0.52 rad/s

    # ═══════════════════════════════════════════════════════════
    # 고도 P-제어 (Formation 모드에서 height_rate 피드백용)
    # ═══════════════════════════════════════════════════════════
    alt_hold_p_gain: 0.1              # P 게인 [1/s] — 1m 오차 → 0.1 m/s height_rate
    alt_hold_hr_max: 2.7              # height_rate 클램프 [m/s]
