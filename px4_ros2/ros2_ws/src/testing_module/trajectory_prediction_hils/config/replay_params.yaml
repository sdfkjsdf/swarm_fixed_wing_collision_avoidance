# Replay 노드 파라미터 (path/rate + predict 메타)
#
# ★ 시정수 (tau_V/tau_hdot/tau_a) 는 airframe_spec.yaml 의 tc_tas/tc_alt/tc_roll
#    로 통합 sourcing. 본 파일에는 horizon/rate 만 둠.

"/**":
  ros__parameters:
    csv_path_prefix: "/tmp/trajectory"     # CSV 파일 prefix (timestamp suffix 자동 추가)
    log_rate_hz: 50.0                       # CSV 쓰기 주기 [Hz]
    # NOTE: sequence_file 은 main.cpp:54 의 declare default 가 동일하게 setpoint_sequence.yaml 을 가리킴.
    # 여기서 정의하면 --params-file 이 CLI -p override 를 덮음 (ros2 humble 인자 순서 동작).
    # run_all_cases.sh 의 case yaml 동적 전환을 위해 본 파일에서 제거. case override 는
    # launch_1vtol_replay.sh 의 -p sequence_file:=${SEQUENCE_FILE} 로 전달됨.

    # ── 예측 (TrajectoryPredict) ──
    # ★ 2026-05-13 endpoint-inclusive 컨벤션:
    #   kPredictHorizon = round(predict_horizon_endpoint_s × predict_rate_hz) + 1
    #   "endpoint_s 는 *마지막 점의 시각*" (양 끝점 포함).
    #   기본: endpoint=4.5s × 10Hz + 1 = 46 점 (t=0.0, 0.1, ..., 4.5s).
    #   *이전 컨벤션 (predict_horizon_s, +1 안 함) 의 45 점 = 0~4.4s* 에서 변경.
    #   어긋나면 노드 시작 시 throw.
    predict_horizon_endpoint_s: 4.5         # 예측 *마지막 점* 의 시각 [s]
    predict_rate_hz:   10.0                 # 예측 점 간격 = 1/rate [s] → dt=0.1s
    predict_call_hz:   10.0                 # predict() 자체 호출 주기 [Hz]

    # ── 7-state covariance propagation Qc diagonal ──
    # Initial engineering values only. Bag ground-truth coverage analysis will
    # calibrate these before formal validation or flight use.
    uncertainty.q_pn:   0.25
    uncertainty.q_pe:   0.25
    uncertainty.q_h:    0.25
    uncertainty.q_v:    0.04
    uncertainty.q_psi:  0.001
    uncertainty.q_hdot: 0.04
    uncertainty.q_phi:  0.001
    # Preliminary calibration from 3 cases x 3 repeats. Keep a conservative
    # margin until independent holdout scenarios are evaluated.
    uncertainty.q_scale: 0.8

    # The PX4 current local-position output follows Gazebo truth by about
    # 0.125-0.130 s in the present 1-VTOL HILS setup. This latency is measured
    # independently from timestamp - timestamp_sample and is compensated before
    # assigning cone horizon zero. Recalibrate when the estimator/sensor setup changes.
    uncertainty.estimator_output_delay_s: 0.13
