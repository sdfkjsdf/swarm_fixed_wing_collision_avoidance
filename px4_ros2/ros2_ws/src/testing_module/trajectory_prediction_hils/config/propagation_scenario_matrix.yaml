version: 1

# Every case is a constant candidate input applied immediately after PX4 enters
# FixedWing.  Values stay fixed through cone generation and the 4.5 s truth tail.
defaults:
  repetitions: 1
  timeout_s: 180
  pause_after_case_s: 2

# Operational avoidance uses horizontal speed/lateral candidates only.  The
# resolver rejects any case that introduces a climb or sink command.
constraints:
  avoidance_height_rate: 0.0

cases:
  # Single-channel speed sweep.  Height rate and lateral acceleration stay zero.
  ZOH_V16_STRAIGHT: { v_cmd: 16.0, lateral_acceleration: 0.0 }
  ZOH_V18_STRAIGHT: { v_cmd: 18.0, lateral_acceleration: 0.0 }
  ZOH_V20_STRAIGHT: { v_cmd: 20.0, lateral_acceleration: 0.0 }
  ZOH_V22_STRAIGHT: { v_cmd: 22.0, lateral_acceleration: 0.0 }
  ZOH_V24_STRAIGHT: { v_cmd: 24.0, lateral_acceleration: 0.0 }

  # Single-channel coordinated-turn sweep at 20 m/s. Values correspond to
  # approximately 5, 15 and 25 degree bank commands.
  ZOH_ALATM4P572_V20: { v_cmd: 20.0, lateral_acceleration: -4.572 }
  ZOH_ALATM2P628_V20: { v_cmd: 20.0, lateral_acceleration: -2.628 }
  ZOH_ALATM0P858_V20: { v_cmd: 20.0, lateral_acceleration: -0.858 }
  ZOH_ALATP0P858_V20: { v_cmd: 20.0, lateral_acceleration: 0.858 }
  ZOH_ALATP2P628_V20: { v_cmd: 20.0, lateral_acceleration: 2.628 }
  ZOH_ALATP4P572_V20: { v_cmd: 20.0, lateral_acceleration: 4.572 }

  # Speed/turn coupled cases are reserved for independent holdout.  Height rate
  # remains zero; vertical motion during banking is observed, never commanded.
  ZOH_C18_ALATP2P628: { v_cmd: 18.0, lateral_acceleration: 2.628 }
  ZOH_C18_ALATM2P628: { v_cmd: 18.0, lateral_acceleration: -2.628 }
  ZOH_C22_ALATM2P628: { v_cmd: 22.0, lateral_acceleration: -2.628 }
  ZOH_C22_ALATP2P628: { v_cmd: 22.0, lateral_acceleration: 2.628 }

profiles:
  # Three-run wiring gate before any unattended batch.
  wiring_smoke:
    dataset: smoke
    seed_base: 10000
    cases:
      - ZOH_V20_STRAIGHT
      - ZOH_ALATP2P628_V20
      - ZOH_ALATM2P628_V20

  # Fit/check speed and lateral response using one channel at a time.
  # Do not tune Q from this profile.
  model_identification:
    dataset: model_fit
    seed_base: 20000
    repetitions: 2
    cases:
      - ZOH_V16_STRAIGHT
      - ZOH_V18_STRAIGHT
      - ZOH_V20_STRAIGHT
      - ZOH_V22_STRAIGHT
      - ZOH_V24_STRAIGHT
      - ZOH_ALATM4P572_V20
      - ZOH_ALATM2P628_V20
      - ZOH_ALATM0P858_V20
      - ZOH_ALATP0P858_V20
      - ZOH_ALATP2P628_V20
      - ZOH_ALATP4P572_V20

  # Coupled commands unseen during single-channel model fitting.
  model_holdout:
    dataset: model_holdout
    seed_base: 30000
    repetitions: 3
    cases:
      - ZOH_C18_ALATP2P628
      - ZOH_C18_ALATM2P628
      - ZOH_C22_ALATM2P628
      - ZOH_C22_ALATP2P628

  # Q calibration spans the baseline and outer command envelope.  Run only
  # after model parameters are frozen.
  cone_calibration:
    dataset: cone_calibration
    seed_base: 40000
    repetitions: 3
    cases:
      - ZOH_V16_STRAIGHT
      - ZOH_V20_STRAIGHT
      - ZOH_V24_STRAIGHT
      - ZOH_ALATM4P572_V20
      - ZOH_ALATM0P858_V20
      - ZOH_ALATP0P858_V20
      - ZOH_ALATP4P572_V20

  # Independent intermediate commands and coupled cases.  These seeds and
  # cases are disjoint from cone_calibration and must remain untouched by Q fit.
  cone_holdout:
    dataset: cone_holdout
    seed_base: 50000
    repetitions: 5
    cases:
      - ZOH_V18_STRAIGHT
      - ZOH_V22_STRAIGHT
      - ZOH_ALATM2P628_V20
      - ZOH_ALATP2P628_V20
      - ZOH_C18_ALATP2P628
      - ZOH_C18_ALATM2P628
      - ZOH_C22_ALATM2P628
      - ZOH_C22_ALATP2P628

  # One pass over every maintained fixed-input case for regression checks.
  regression_all:
    dataset: regression
    seed_base: 60000
    repetitions: 1
    cases:
      - ZOH_V16_STRAIGHT
      - ZOH_V18_STRAIGHT
      - ZOH_V20_STRAIGHT
      - ZOH_V22_STRAIGHT
      - ZOH_V24_STRAIGHT
      - ZOH_ALATM4P572_V20
      - ZOH_ALATM2P628_V20
      - ZOH_ALATM0P858_V20
      - ZOH_ALATP0P858_V20
      - ZOH_ALATP2P628_V20
      - ZOH_ALATP4P572_V20
      - ZOH_C18_ALATP2P628
      - ZOH_C18_ALATM2P628
      - ZOH_C22_ALATM2P628
      - ZOH_C22_ALATP2P628

  # Full horizontal-command Monte Carlo sweep.  Five independent Gazebo seeds
  # are collected for every maintained straight, symmetric-turn and coupled
  # speed/turn case.  No climb or sink command is introduced.
  monte_carlo_all:
    dataset: monte_carlo
    seed_base: 70000
    repetitions: 5
    cases:
      - ZOH_V16_STRAIGHT
      - ZOH_V18_STRAIGHT
      - ZOH_V20_STRAIGHT
      - ZOH_V22_STRAIGHT
      - ZOH_V24_STRAIGHT
      - ZOH_ALATM4P572_V20
      - ZOH_ALATM2P628_V20
      - ZOH_ALATM0P858_V20
      - ZOH_ALATP0P858_V20
      - ZOH_ALATP2P628_V20
      - ZOH_ALATP4P572_V20
      - ZOH_C18_ALATP2P628
      - ZOH_C18_ALATM2P628
      - ZOH_C22_ALATM2P628
      - ZOH_C22_ALATP2P628
