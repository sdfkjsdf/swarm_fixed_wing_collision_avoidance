"/**":
  ros__parameters:
    # Existing AMAC candidate-management policy. Numerical superiority margins
    # are project HILS values because the public source does not disclose them.
    amac_active_switching_enabled: true
    amac_active_switch_cost_margin: 0.01
    amac_active_switch_minimum_ad_margin_m: 1.0
    # Keep the Lockheed/AMAC baseline AD-only. The CBF positive-margin filter
    # belongs to explicitly configured CBF comparison profiles.
    positive_margin_filter_enabled: false

    # Bounded CPA project reconstruction. The relative-speed threshold is the
    # rounded 3-sigma first-difference noise estimate from the final half of
    # flocking_only_baseline_20260831_01 at 10 Hz.
    amac_relative_speed_epsilon_mps: 0.21
    amac_cpa_horizon_s: 4.5

    # Formation remains the nominal guidance mode, but collision avoidance
    # must not exempt threats using a geometry-specific line calibration.
    # Every pair therefore remains subject to the same AD activation rule.
    formation_discrimination_enabled: false
